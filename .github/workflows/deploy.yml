name: deploy

# Elke pull request krijgt een live voorbeeld op /pr-preview/pr-<nummer>/; na een
# merge naar main wordt de echte site bijgewerkt. Beide staan op de branch
# `gh-pages`, die GitHub Pages publiceert op https://pdf.nondumsc.io/.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write # gh-pages bijwerken
  pull-requests: write # opmerking met de voorbeeldlink

env:
  SITE_URL: https://pdf.nondumsc.io

jobs:
  preview:
    # Alleen voor PR's uit deze repo; een fork krijgt geen schrijfrechten. Dependabot ook
    # niet (GitHub geeft zijn PR's alleen leesrechten): die PR's bekijk je via de checks.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Per PR één wachtrij: een nieuwere push op dezelfde PR vervangt een wachtende oudere.
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bouwen
        if: github.event.action != 'closed'
        run: |
          # Het versienummer volgt het PR-nummer, bijvoorbeeld PR.009.
          export VITE_APP_VERSION="$(node scripts/app-version.ts --pr "${{ github.event.number }}")"
          echo "Versie: $VITE_APP_VERSION"
          npm ci
          npm run build
          # Deze twee horen alleen in de hoofdmap van de site, niet in een voorbeeld.
          rm -f dist/CNAME dist/.nojekyll
      # rossjrw/pr-preview-action v1.8.1
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9
        with:
          source-dir: dist
          umbrella-dir: pr-preview
          pages-base-url: pdf.nondumsc.io
          # Geen externe QR-dienst: de link zou daar naartoe gestuurd worden.
          qr-code: 'false'

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Een eigen wachtrij voor main: voorbeelden van PR's kunnen deze uitrol niet wegdrukken.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bouwen
        run: |
          # Na een merge staat het PR-nummer in de eerste regel van de merge-commit.
          export VITE_APP_VERSION="$(node scripts/app-version.ts --subject "$(git log -1 --pretty=%s)" --sha "$GITHUB_SHA")"
          echo "Versie: $VITE_APP_VERSION"
          npm ci
          npm run build
          echo "$GITHUB_SHA" > dist/version.txt
      # JamesIves/github-pages-deploy-action v4.9.0
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          branch: gh-pages
          folder: dist
          # De voorbeelden van open PR's blijven staan.
          clean-exclude: pr-preview/
      - name: Rooktest op de live site
        run: |
          for i in $(seq 1 30); do
            live=$(curl --silent --location "$SITE_URL/version.txt" || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live: $GITHUB_SHA"
              exit 0
            fi
            echo "Poging $i: live is '$live', verwacht '$GITHUB_SHA'"
            sleep 10
          done
          echo "De nieuwe versie kwam niet live binnen 5 minuten" >&2
          exit 1
      - name: Restanten van gesloten voorbeelden opruimen
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add -B gh-pages "$RUNNER_TEMP/gh-pages" origin/gh-pages
          removed=$(node scripts/prune-previews.ts "$RUNNER_TEMP/gh-pages/pr-preview")
          if [ -z "$removed" ]; then
            echo "Niets op te ruimen"
            exit 0
          fi
          echo "Opgeruimd: $removed"
          cd "$RUNNER_TEMP/gh-pages"
          # Naam en e-mail ook nodig voor het bijwerken (rebase) hieronder.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restanten van gesloten voorbeelden opruimen"
          # Pushte een voorbeeld tegelijk naar gh-pages? Dan bijwerken en opnieuw proberen.
          for poging in 1 2 3; do
            if git push origin gh-pages; then exit 0; fi
            echo "Push geweigerd (poging $poging), bijwerken en opnieuw"
            git pull --rebase origin gh-pages
          done
          exit 1
