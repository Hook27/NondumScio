name: deploy

# Elke pull request krijgt een live voorbeeld op /pr-preview/pr-<nummer>/; na een
# merge naar main wordt de echte site bijgewerkt. Beide staan op de branch
# `gh-pages`, die GitHub Pages publiceert op https://pdf.nondumsc.io/.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write # gh-pages bijwerken
  pull-requests: write # opmerking met de voorbeeldlink

# Alle uitrollen na elkaar: ze schrijven allemaal naar dezelfde branch.
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  SITE_URL: https://pdf.nondumsc.io

jobs:
  preview:
    # Alleen voor PR's uit deze repo; een fork krijgt geen schrijfrechten.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bouwen
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build
      # rossjrw/pr-preview-action v1.8.1
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9
        with:
          source-dir: dist
          umbrella-dir: pr-preview
          pages-base-url: pdf.nondumsc.io
          # Geen externe QR-dienst: de link zou daar naartoe gestuurd worden.
          qr-code: 'false'

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bouwen
        run: |
          npm ci
          npm run build
          echo "$GITHUB_SHA" > dist/version.txt
      # JamesIves/github-pages-deploy-action v4.9.0
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          branch: gh-pages
          folder: dist
          # De voorbeelden van open PR's blijven staan.
          clean-exclude: pr-preview/
      - name: Rooktest op de live site
        run: |
          for i in $(seq 1 30); do
            live=$(curl --silent --location "$SITE_URL/version.txt" || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live: $GITHUB_SHA"
              exit 0
            fi
            echo "Poging $i: live is '$live', verwacht '$GITHUB_SHA'"
            sleep 10
          done
          echo "De nieuwe versie kwam niet live binnen 5 minuten" >&2
          exit 1
