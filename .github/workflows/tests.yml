name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Een nieuwe push op dezelfde branch annuleert de oude run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # De naam `test` is de verplichte check in de ruleset van main: niet hernoemen.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Opmaak
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecontrole
        run: npm run typecheck
      - name: Unit-tests
        run: npm test
      - name: Build
        run: npm run build

  # Browsertests: de echte productiebuild in een echte browser, op desktop en telefoon.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Browser onthouden tussen runs
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Browser installeren
        run: npx playwright install --with-deps chromium
      - name: Browsertests
        run: npm run e2e
      - name: Rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7
