name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Een nieuwe push op dezelfde branch annuleert de oude run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # De naam `test` is de verplichte check in de ruleset van main: niet hernoemen.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Opmaak
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecontrole
        run: npm run typecheck
      - name: Unit-tests
        run: npm test
      - name: Build
        run: npm run build

  # Browsertests: de echte productiebuild in een echte browser, op desktop en telefoon.
  e2e:
    runs-on: ubuntu-latest
    # Kant-en-klare omgeving van Microsoft waarin de browser en alle systeempakketten al
    # zitten. Zo hoeven we niets meer van Ubuntu-servers te downloaden (dat duurde soms
    # 10 minuten). De versie moet gelijk zijn aan @playwright/test in package-lock.json;
    # scripts/playwright-container.test.ts bewaakt dat.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Browsertests
        run: npm run e2e
      - name: Rapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7
