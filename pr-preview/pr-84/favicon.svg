<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Nondum Scio</title>
  <!-- Perkament -->
  <rect width="64" height="64" rx="10" fill="#f0d7a7" />
  <g fill="#2a1a10">
    <!-- Bladeren in de hoeken, zoals in de houtsnede-initiaal -->
    <g id="leaf">
      <ellipse cx="10.5" cy="10.5" rx="4.2" ry="1.9" transform="rotate(45 10.5 10.5)" />
    </g>
    <use href="#leaf" transform="translate(64 0) scale(-1 1)" />
    <use href="#leaf" transform="translate(0 64) scale(1 -1)" />
    <use href="#leaf" transform="translate(64 64) scale(-1 -1)" />
  </g>
  <!-- Medaillon -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#2a1a10" stroke-width="3.2" />
  <!-- Hoofdletter N: dunne stokken, dikke schuine streep, schreven -->
  <g fill="#2a1a10">
    <rect x="21.4" y="21" width="3" height="22" />
    <rect x="39.6" y="21" width="3" height="22" />
    <polygon points="21.4,21 28.6,21 42.6,43 35.4,43" />
    <rect x="18.4" y="20" width="10.4" height="2.2" />
    <rect x="36.2" y="20" width="9.4" height="2.2" />
    <rect x="18.4" y="41.8" width="9.4" height="2.2" />
    <rect x="36.2" y="41.8" width="9.4" height="2.2" />
  </g>
</svg>
